# リリース。`v*` のタグを push すると、OS ごとに自動検査（bun run check）を通したうえで、
# Windows x64 のインストーラー（NSIS）と macOS（Apple Silicon）の .dmg をビルドし、
# GitHub Releases の 1 つのドラフトにそろえる。ドラフトの公開は手動で行う
# コード署名は、Windows はしない（SmartScreen の警告は README に書く）。
# macOS はアドホック署名だけで、Developer ID の署名と公証はしない
# （tauri.macos.conf.json の signingIdentity が "-"。初回の開き方は README に書く）
name: Release

on:
  push:
    tags:
      - "v*"

# リリースの作成とファイルの添付に書き込み権限が要る
permissions:
  contents: write

# 同じタグの実行が重なったら、あとのものを待たせる（実行中のビルドは止めない）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      # 片方が失敗しても、もう片方の結果を見られるようにする
      fail-fast: false
      # 1 つのドラフトに両 OS のファイルを足すため、1 つずつ順に実行する。
      # 同時に走らせると、tauri-action が同じタグのドラフトを 2 つ作ることがある
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            # インストーラー（NSIS の setup.exe）だけを作る。MSI は作らない
            args: --bundles nsis
            rust-targets: ""
          # macOS 26 の Apple Silicon（arm64）のランナー。Intel Mac は対象外。
          # アイコンは手元で作った src-tauri/macos/Assets.car を使い、ここでは actool を呼ばない
          # （ランナーでは actool が落ちるため。tauri#15315）
          - platform: macos-26
            args: --target aarch64-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # タグ（v0.1.0）と package.json の version（0.1.0）が食い違ったまま出さない。
      # tauri.conf.json と Cargo.toml の version も同じ値であること
      - name: タグとバージョン表記の一致を確かめる
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "tag=$tagVersion package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if ($pkg -ne $tagVersion -or $tauri -ne $tagVersion -or $cargo -ne $tagVersion) {
            Write-Error "タグのバージョン($tagVersion)と、各ファイルのバージョン表記が一致しません。"
            exit 1
          }

      # Bun の版は package.json の packageManager に合わせる（ci.yml と同じ）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 依存のインストール
        run: bun install --frozen-lockfile

      # ci.yml と同じ検査。通らなければ、ビルドとリリースの作成に進まない
      - name: 自動検査
        run: bun run check

      - name: ビルドとドラフトリリースの作成
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Sonar Spectra ${{ github.ref_name }}
          releaseBody: |
            変更点は CHANGELOG.md を参照してください。

            **Windows**（`.exe`）：コード署名がないため、初回起動時に SmartScreen の警告が出ることがあります。0.1.0（表示名 `sonar_spectra`）を入れているときは、そのまま実行してください。0.1.0 は自動で取り除かれ、設定と構成は引き継がれます。

            **macOS**（Apple Silicon、macOS 26 以降、`.dmg`）：アドホック署名だけで、公証はしていません。ダウンロードしたアプリは、初回に「システム設定」→「プライバシーとセキュリティ」の「このまま開く」で開いてください（版ごとに必要です）。更新したあとは、システムオーディオ録音の許可が外れるため、「システム設定」→「プライバシーとセキュリティ」→「画面とシステムオーディオ録音」で Sonar Spectra をオンにし直してください。

            詳しくは README を参照してください。
          releaseDraft: true
          prerelease: false
          # 自動更新は使わないため、updater 用の latest.json は作らない
          uploadUpdaterJson: false

      # Apple環境向けアイコン（Assets.car）と従来形式（.icns）が組み込まれたことを確かめる。
      # --bundles dmg では、.dmg を作ったあとに .app が片づけられるため、.dmg をマウントして中の .app を調べる
      - name: アプリのアイコン（Assets.car と .icns）と署名を確かめる
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null' EXIT
          app="$mnt/Sonar Spectra.app"
          ls "$app/Contents/Resources"
          test -f "$app/Contents/Resources/Assets.car"
          test -f "$app/Contents/Resources/icon.icns"
          codesign -dv "$app" 2>&1 | grep "Signature=adhoc"
