# 自動検査（bun run check）。push とプルリクエストで、Windows と macOS のランナーで実行する。
# 出力音声の取得は OS ごとに条件付きでコンパイルする（Windows は WASAPI、macOS は Process Tap）ため、
# 両方で clippy とテストにかける。macOS は Apple Silicon（arm64）のランナーを使う
# bun run check が読まないファイル（計画と記録・ブランドの写し・文書）だけの変更では実行しない
name: CI

on:
  push:
    paths-ignore:
      - "roadmap/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "roadmap/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # 片方の OS で失敗しても、もう片方の結果を見られるようにする
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Bun の版は package.json の packageManager に合わせる
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 依存のインストール
        run: bun install --frozen-lockfile

      - name: 自動検査
        run: bun run check
