<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="200"/></clipPath>
  <g clip-path="url(#tile)">
    <g transform="translate(0 0) scale(1)">
<!-- sonar_spectra アイコンのマスター（v2）
       レイヤー：最上位の<g>を奥から 00_bg → 03_peak の順に置く。00_bg は地だけを持つ
       余白ルール：00_bg は1024四方いっぱいの角のない正方形。前景は中央の800四方（四辺112）に収める
       角丸・発光・透明度は持たない（OSごとの展開時、またはIcon Composerで付ける）
       色は sonar_spectra_tokens.css のダーク値（bg / neon-b / neon-a / neon-c） -->
  <g id="00_bg">
    <rect x="0" y="0" width="1024" height="1024" fill="#07060f"/>
  </g>
  <g id="01_ring">
    <circle cx="512" cy="512" r="330" fill="none" stroke="#18e4ff" stroke-width="56"/>
  </g>
  <g id="02_wave">
    <path d="M182 512 H330 L392 600 L456 330 L536 712 L604 420 L660 552 L700 512 H842" fill="none" stroke="#ff2bd6" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="03_peak">
    <circle cx="456" cy="330" r="46" fill="#ffb547"/>
  </g>
    </g>
  </g>
</svg>
